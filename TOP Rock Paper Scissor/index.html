<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Box Model</title>
  <style>
    button {
      width: 400;
      height: 400;
    }
  </style>
  
</head>

<body>
  <button id="rock"><img src="rock.png" width="400" height="400">Rock</button>
  <button id="paper"><img src="paper.jpeg" width="400" height="400">Paper</button>
  <button id="scissors"><img src="scissors.png" width="400" height="400">Scissors</button>
  <script src="scripts.js"></script> 
  <div .class="score" id="humScore">Human score is:0</div>
  <div .class="score" id="comScore">Computer score is:0</div>

</body>

</html>
